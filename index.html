<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京ディズニーシー攻略チェックリスト</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(135deg,#075985,#0284c7);
  color:white;
  padding:14px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1100px;
  margin:0 auto;
}

h1{
  margin:0 0 5px;
  font-size:21px;
  line-height:1.4;
}

.status{
  font-size:13px;
  opacity:.95;
}

.container{
  max-width:1100px;
  margin:18px auto;
  padding:0 12px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  font-size:13px;
  font-weight:bold;
  background:white;
  color:#075985;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  cursor:pointer;
}

button:hover{
  background:#eef8ff;
}

.tablewrap{
  overflow:auto;
  background:white;
  border-radius:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
  width:100%;
  min-width:850px;
  border-collapse:separate;
  border-spacing:0;
}

th,td{
  padding:9px;
  border-bottom:1px solid #e8ebf2;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#eef2f8;
  font-size:13px;
  white-space:nowrap;
}

td{
  font-size:14px;
}

tbody tr:last-child td{
  border-bottom:0;
}

.check-cell{
  text-align:center;
  width:70px;
}

input[type="checkbox"]{
  width:22px;
  height:22px;
  cursor:pointer;
  accent-color:#0284c7;
}

.area{
  white-space:nowrap;
  font-size:13px;
  color:#555;
}

.name{
  font-weight:600;
  min-width:280px;
}

.types{
  min-width:180px;
}

.type{
  display:inline-block;
  margin:2px 3px 2px 0;
  padding:4px 7px;
  border-radius:7px;
  background:#eef2f8;
  font-size:12px;
  white-space:nowrap;
}

.dpa{
  white-space:nowrap;
  font-weight:bold;
  color:#b45309;
}

.no-dpa{
  color:#888;
  font-weight:normal;
}

.checked-row{
  background:#f3f8fb;
}

.checked-row .name{
  color:#888;
  text-decoration:line-through;
}

.hidden-row{
  display:none;
}

.note{
  margin-top:12px;
  color:#666;
  font-size:12px;
  line-height:1.6;
}

@media(max-width:600px){
  h1{
    font-size:18px;
  }

  button{
    min-height:42px;
  }

  .container{
    margin-top:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>🌊 東京ディズニーシー攻略チェックリスト</h1>
    <div class="status" id="status">
      チェック済み 0 / 38 ・ 表示 38件
    </div>
  </div>
</header>

<main class="container">

  <div class="controls">
    <button type="button" id="showAll">すべて表示</button>
    <button type="button" id="showUnchecked">未チェックのみ</button>
    <button type="button" id="showChecked">チェック済みのみ</button>
    <button type="button" id="reset">チェックをリセット</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>乗りたい</th>
          <th>エリア名</th>
          <th>アトラクション・ショー・グリーティング名</th>
          <th>種類</th>
          <th>DPA</th>
        </tr>
      </thead>

      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="note">
    ※ DPA料金は設定されている施設について表示しています。<br>
    ※ グリーティングはキャラクターごとに分けています。<br>
    ※ 花火・環境演出・パレード・ショーレストランは対象外です。
  </div>

</main>

  {
    area:"パークエントランス",
    name:"ディズニーシー・プラザ（キャラクターグリーティング）",
    types:["🤝 グリーティング"],
    dpa:null
  }
];

const STORAGE_KEY = "disneysea-checklist-state";

let checked = loadState();
let filter = "all";

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved) && saved.length === attractions.length){
      return saved;
    }
  }catch(e){}

  return attractions.map(() => false);
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  let visibleCount = 0;

  attractions.forEach((item,index)=>{
    const isChecked = checked[index];

    if(
      (filter === "unchecked" && isChecked) ||
      (filter === "checked" && !isChecked)
    ){
      return;
    }

    visibleCount++;

    const tr = document.createElement("tr");

    if(isChecked){
      tr.classList.add("checked-row");
    }

    const checkTd = document.createElement("td");
    checkTd.className = "check-cell";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = isChecked;
    checkbox.setAttribute(
      "aria-label",
      item.name + "をチェック"
    );

    checkbox.addEventListener("change",()=>{
      checked[index] = checkbox.checked;
      saveState();
      render();
    });

    checkTd.appendChild(checkbox);

    const areaTd = document.createElement("td");
    areaTd.className = "area";
    areaTd.textContent = item.area;

    const nameTd = document.createElement("td");
    nameTd.className = "name";
    nameTd.textContent = item.name;

    const typesTd = document.createElement("td");
    typesTd.className = "types";

    item.types.forEach(type=>{
      const span = document.createElement("span");
      span.className = "type";
      span.textContent = type;
      typesTd.appendChild(span);
    });

    const dpaTd = document.createElement("td");

    if(item.dpa){
      dpaTd.className = "dpa";
      dpaTd.textContent = item.dpa;
    }else{
      dpaTd.className = "dpa no-dpa";
      dpaTd.textContent = "—";
    }

    tr.appendChild(checkTd);
    tr.appendChild(areaTd);
    tr.appendChild(nameTd);
    tr.appendChild(typesTd);
    tr.appendChild(dpaTd);

    list.appendChild(tr);
  });

  const checkedCount = checked.filter(Boolean).length;

  document.getElementById("status").textContent =
    `チェック済み ${checkedCount} / ${attractions.length} ・ 表示 ${visibleCount}件`;
}

document.getElementById("showAll").addEventListener("click",()=>{
  filter = "all";
  render();
});

document.getElementById("showUnchecked").addEventListener("click",()=>{
  filter = "unchecked";
  render();
});

document.getElementById("showChecked").addEventListener("click",()=>{
  filter = "checked";
  render();
});

document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("チェックをすべてリセットしますか？")){
    checked = attractions.map(() => false);
    saveState();
    render();
  }
});

render();
</script>

</html>
