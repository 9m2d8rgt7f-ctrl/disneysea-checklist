<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#075985">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ディズニーシー攻略">

<title>東京ディズニーシー攻略チェックリスト</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",
    "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#075985;
  color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 12px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-inner{
  max-width:950px;
  margin:auto;
}

h1{
  font-size:19px;
  margin:0 0 6px;
  line-height:1.4;
}

#summary{
  font-size:13px;
  opacity:.9;
}

main{
  max-width:950px;
  margin:auto;
  padding:10px;
}

.panel{
  background:white;
  border-radius:15px;
  padding:11px;
  margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

label{
  font-size:13px;
  font-weight:700;
  display:block;
  margin-bottom:5px;
}

button,
select{
  font:inherit;
  border:1px solid #d5dbea;
  background:white;
  border-radius:10px;
  padding:8px 10px;
  min-height:40px;
  cursor:pointer;
}

button.active{
  background:#075985;
  color:white;
  border-color:#075985;
}

button.reset{
  color:#a22;
  background:#fff5f5;
}

button:hover{
  opacity:.9;
}

.row,
.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.small{
  font-size:12px;
  color:#667085;
  margin-top:6px;
  line-height:1.5;
}

.tablewrap{
  overflow:auto;
  background:white;
  border-radius:15px;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:separate;
  border-spacing:0;
}

th,
td{
  padding:9px;
  border-bottom:1px solid #e8ebf2;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#eef2f8;
  font-size:13px;
  white-space:nowrap;
}

td{
  font-size:14px;
}

.check{
  width:22px;
  height:22px;
  accent-color:#075985;
  cursor:pointer;
}

.check-cell{
  width:65px;
  text-align:center;
}

.area{
  font-size:12px;
  color:#596579;
  white-space:nowrap;
}

.name{
  font-weight:700;
  min-width:280px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin:2px 3px 2px 0;
  border-radius:999px;
  background:#f0f3f8;
  font-size:12px;
  white-space:nowrap;
}

.dpa{
  font-weight:700;
  white-space:nowrap;
  color:#b45309;
}

.none{
  font-weight:400;
  color:#98a2b3;
}

.checked-row{
  background:#f7fafc;
}

.checked-row .name{
  color:#8a94a6;
  text-decoration:line-through;
}

@media(max-width:600px){
  h1{
    font-size:18px;
  }

  button{
    min-height:42px;
  }

  main{
    padding:8px;
  }

  .panel{
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>🌊 東京ディズニーシー攻略チェックリスト</h1>
    <div id="summary"></div>
  </div>
</header>

<main>

  <!-- DPA・チェックフィルター -->
  <section class="panel">

    <div class="row">

      <div>
        <label>DPA</label>

        <button data-g="dpa" data-v="all" class="active">
          すべて
        </button>

        <button data-g="dpa" data-v="yes">
          DPAのみ
        </button>

        <button data-g="dpa" data-v="no">
          DPAなし
        </button>
      </div>

      <div>
        <label>チェック</label>

        <button data-g="check" data-v="all" class="active">
          すべて
        </button>

        <button data-g="check" data-v="unchecked">
          未チェック
        </button>

        <button data-g="check" data-v="checked">
          チェック済み
        </button>
      </div>

    </div>

  </section>


  <!-- 種類フィルター -->
  <section class="panel">

    <label>種類（複数選択は OR 条件）</label>

    <div id="types" class="tags"></div>

    <div class="small">
      例：🎢＋🚤 →「コースター または ボート」
    </div>

  </section>


  <!-- 並べ替え -->
  <section class="panel">

    <label>並べ替え</label>

    <div class="row">

      <select id="sort">

        <option value="area">
          エリア順
        </option>

        <option value="name">
          アトラクション名順
        </option>

        <option value="type">
          種類順
        </option>

        <option value="dpa">
          DPA順
        </option>

        <option value="checked">
          チェック済み優先
        </option>

      </select>

      <button id="reset" class="reset">
        チェックをすべてリセット
      </button>

    </div>

  </section>


  <!-- 一覧 -->
  <section class="tablewrap">

    <table>

      <thead>

        <tr>
          <th>乗りたい</th>
          <th>エリア名</th>
          <th>アトラクション・ショー・グリーティング名</th>
          <th>種類</th>
          <th>DPA</th>
        </tr>

      </thead>

      <tbody id="body"></tbody>

    </table>

  </section>

</main>

    name:"ディズニーシー・プラザ（キャラクターグリーティング）",
    types:["🤝"],
    dpa:0
  }

];


/* =========================================================
   種類
   ========================================================= */

const types = [
  "🎢",
  "🚤",
  "🚂",
  "🚶",
  "🎭",
  "🎯",
  "🤝",
  "🔄",
  "🎬"
];

const typeName = {
  "🎢":"コースター",
  "🚤":"ボート",
  "🚂":"ライド",
  "🚶":"ウォークスルー",
  "🎭":"シアター",
  "🎯":"インタラクティブ",
  "🤝":"グリーティング",
  "🔄":"回転",
  "🎬":"ショー"
};


/* =========================================================
   保存
   ========================================================= */

const STORAGE_KEY = "tds_check_v1";

let checked = [];

try{
  checked = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if(!Array.isArray(checked)){
    checked=[];
  }

}catch(e){
  checked=[];
}


/* =========================================================
   フィルター・並べ替え
   ========================================================= */

let filter = {
  dpa:"all",
  check:"all",
  types:[]
};

let sort = "area";


/* =========================================================
   エリア順
   ========================================================= */

const areaOrder = [
  "メディテレーニアンハーバー",
  "アメリカンウォーターフロント",
  "ポートディスカバリー",
  "ロストリバーデルタ",
  "ファンタジースプリングス",
  "アラビアンコースト",
  "マーメイドラグーン",
  "ミステリアスアイランド",
  "パークエントランス"
];


/* =========================================================
   種類ボタン生成
   ========================================================= */

const typeBox = document.getElementById("types");

types.forEach(type => {

  const button = document.createElement("button");

  button.textContent =
    type + " " + typeName[type];

  button.onclick = () => {

    if(filter.types.includes(type)){

      filter.types =
        filter.types.filter(
          x => x !== type
        );

    }else{

      filter.types =
        [...filter.types,type];

    }

    button.classList.toggle(
      "active",
      filter.types.includes(type)
    );

    render();
  };

  typeBox.appendChild(button);

});


/* =========================================================
   DPA・チェックフィルター
   ========================================================= */

document
  .querySelectorAll("[data-g]")
  .forEach(button => {

    button.onclick = () => {

      const group =
        button.dataset.g;

      const value =
        button.dataset.v;

      filter[group] = value;

      document
        .querySelectorAll(
          '[data-g="' + group + '"]'
        )
        .forEach(other => {
          other.classList.remove("active");
        });

      button.classList.add("active");

      render();

    };

  });


/* =========================================================
   並べ替え
   ========================================================= */

document
  .getElementById("sort")
  .onchange = event => {

    sort = event.target.value;

    render();

  };


/* =========================================================
   保存
   ========================================================= */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(checked)
  );

}


/* =========================================================
   リセット
   ========================================================= */

document
  .getElementById("reset")
  .onclick = () => {

    if(
      confirm(
        "チェックをすべてリセットしますか？"
      )
    ){

      checked = [];

      save();

      render();

    }

  };


/* =========================================================
   チェック状態
   ========================================================= */

function isChecked(index){

  return checked.includes(index);

}


/* =========================================================
   表示対象の取得
   ========================================================= */

function getRows(){

  let rows =
    data.map((item,index) => ({
      item,
      index,
      done:isChecked(index)
    }));


  /* DPA */

  if(filter.dpa === "yes"){

    rows =
      rows.filter(
        row => row.item.dpa > 0
      );

  }

  if(filter.dpa === "no"){

    rows =
      rows.filter(
        row => row.item.dpa === 0
      );

  }


  /* チェック */

  if(filter.check === "checked"){

    rows =
      rows.filter(
        row => row.done
      );

  }

  if(filter.check === "unchecked"){

    rows =
      rows.filter(
        row => !row.done
      );

  }


  /* 種類
     複数選択は OR 条件 */

  if(filter.types.length > 0){

    rows =
      rows.filter(row =>
        filter.types.some(
          type =>
            row.item.types.includes(type)
        )
      );

  }


  /* 並べ替え */

  if(sort === "area"){

    rows.sort((a,b) => {

      const areaA =
        areaOrder.indexOf(a.item.area);

      const areaB =
        areaOrder.indexOf(b.item.area);

      return (
        areaA - areaB ||
        a.index - b.index
      );

    });

  }


  if(sort === "name"){

    rows.sort((a,b) =>
      a.item.name.localeCompare(
        b.item.name,
        "ja"
      )
    );

  }


  if(sort === "type"){

    rows.sort((a,b) => {

      const typeA =
        a.item.types.join(",");

      const typeB =
        b.item.types.join(",");

      return typeA.localeCompare(
        typeB
      );

    });

  }


  if(sort === "dpa"){

    rows.sort((a,b) =>
      (b.item.dpa || 0) -
      (a.item.dpa || 0)
    );

  }


  if(sort === "checked"){

    rows.sort((a,b) =>
      Number(b.done) -
      Number(a.done) ||
      a.index -
      b.index
    );

  }


  return rows;

}


/* =========================================================
   表示
   ========================================================= */

function render(){

  const rows = getRows();

  const body =
    document.getElementById("body");

  body.innerHTML = "";


  rows.forEach(row => {

    const item = row.item;
    const index = row.index;

    const tr =
      document.createElement("tr");


    if(row.done){

      tr.classList.add(
        "checked-row"
      );

    }


    /* チェック */

    const checkTd =
      document.createElement("td");

    checkTd.className =
      "check-cell";


    const checkbox =
      document.createElement("input");

    checkbox.type =
      "checkbox";

    checkbox.className =
      "check";

    checkbox.checked =
      row.done;


    checkbox.setAttribute(
      "aria-label",
      item.name + "をチェック"
    );


    checkbox.onchange = () => {

      if(checkbox.checked){

        if(!checked.includes(index)){

          checked.push(index);

        }

      }else{

        checked =
          checked.filter(
            i => i !== index
          );

      }

      save();

      render();

    };


    checkTd.appendChild(
      checkbox
    );

    tr.appendChild(
      checkTd
    );


    /* エリア */

    const areaTd =
      document.createElement("td");

    areaTd.className =
      "area";

    areaTd.textContent =
      item.area;

    tr.appendChild(
      areaTd
    );


    /* 名前 */

    const nameTd =
      document.createElement("td");

    nameTd.className =
      "name";

    nameTd.textContent =
      item.name;

    tr.appendChild(
      nameTd
    );


    /* 種類 */

    const typeTd =
      document.createElement("td");


    item.types.forEach(type => {

      const badge =
        document.createElement("span");

      badge.className =
        "badge";

      badge.textContent =
        type + " " + typeName[type];

      typeTd.appendChild(
        badge
      );

    });


    tr.appendChild(
      typeTd
    );


    /* DPA */

    const dpaTd =
      document.createElement("td");

    if(item.dpa > 0){

      dpaTd.className =
        "dpa";

      dpaTd.textContent =
        item.dpa.toLocaleString() +
        "円";

    }else{

      dpaTd.className =
        "dpa none";

      dpaTd.textContent =
        "—";

    }


    tr.appendChild(
      dpaTd
    );


    body.appendChild(
      tr
    );

  });


  /* サマリー */

  const checkedCount =
    checked.length;

  document
    .getElementById("summary")
    .textContent =
      "チェック済み " +
      checkedCount +
      " / " +
      data.length +
      " ・ 表示 " +
      rows.length +
      "件";

}


/* =========================================================
   初期表示
   ========================================================= */

render();

</script>

</body>
</html>
